name: exchange

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open the Streamlit app now"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore last ping state
        uses: actions/cache/restore@v4
        with:
          path: .keepalive-state.json
          key: keepalive-${{ github.run_id }}
          restore-keys: |
            keepalive-

      - name: Use Streamlit (browser)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          STREAMLIT_SEARCH: ${{ secrets.STREAMLIT_SEARCH }}
          KEEPALIVE_FORCE: ${{ github.event.inputs.force }}
        run: python keepalive.py

      - name: Save next-due state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .keepalive-state.json
          key: keepalive-${{ github.run_id }}
